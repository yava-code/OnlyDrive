name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # Native mount smoke on both Unix platforms: rclone ships the backends in
  # the official binary (nfsmount on macOS, FUSE on Linux; GitHub runners have
  # /dev/fuse). The runner gets rclone via the setup step, GD_RCLONE points
  # the Manager at it instead of the managed ~/.gd/bin copy.
  unix-mount-smoke:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install rclone (mount backends)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install rclone; else sudo apt-get update -qq && sudo apt-get install -y rclone; fi
          rclone version
      - name: Live mount smoke (local fs remote)
        env:
          GD_LIVE_SMOKE: '1'
          GD_RCLONE: /usr/local/bin/rclone
        run: go test ./internal/serve/ -run TestLiveLocalMount -v

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
