version: 2
project_name: gd

builds:
  - id: gd
    main: ./cmd/gd
    binary: gd-{{ .Os }}-{{ .Arch }}
    env: [CGO_ENABLED=0]
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
      - goos: linux
        goarch: arm64
  - id: gd-ui
    main: ./cmd/gd-gui
    binary: gd-ui-{{ .Os }}-{{ .Arch }}
    env: [CGO_ENABLED=0]
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
      - goos: linux
        goarch: arm64

# Ship raw binaries named after the build id; windows gets the .exe suffix.
# One archive group per build id, ids matched by build id, so names never
# collide (the earlier duplicate-name failure came from both groups emitting
# the same template without a build id filter).
archives:
  - id: gd
    builds: [gd]
    formats: [binary]
    name_template: >-
      {{- .ProjectName -}}-{{ .Os }}-{{ .Arch }}
      {{- if and (eq .Os "windows") (eq .Arch "amd64") }}.exe{{ end -}}
  - id: gd-ui
    builds: [gd-ui]
    formats: [binary]
    name_template: >-
      {{- .ProjectName -}}-ui-{{ .Os }}-{{ .Arch }}
      {{- if and (eq .Os "windows") (eq .Arch "amd64") }}.exe{{ end -}}

checksum:
  name_template: 'checksums.txt'
changelog:
  sort: asc
