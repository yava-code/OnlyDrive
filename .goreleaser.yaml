version: 2
project_name: gd
builds:
  - id: gd
    main: ./cmd/gd
    binary: gd-{{ .Os }}-{{ .Arch }}
    env: [CGO_ENABLED=0]
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
      - goos: linux
        goarch: arm64
  - id: gd-ui
    main: ./cmd/gd-gui
    binary: gd-ui-{{ .Os }}-{{ .Arch }}
    env: [CGO_ENABLED=0]
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
      - goos: linux
        goarch: arm64
archives:
  - id: gd
    formats: [binary]
    name_template: >-
      {{- .Binary -}}
      {{- if and (eq .Os "windows") (eq .Arch "amd64") }}.exe{{ end -}}
  - id: gd-ui
    formats: [binary]
    name_template: >-
      {{- .Binary -}}
      {{- if and (eq .Os "windows") (eq .Arch "amd64") }}.exe{{ end -}}
checksum:
  name_template: 'checksums.txt'
changelog:
  sort: asc
